# 블로그·인스타그램 새 글을 자동으로 반영해 홈페이지를 다시 만들고 GitHub Pages에 올린다.
name: 홈페이지 자동 업데이트

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"   # 3시간마다 (UTC 기준)
  workflow_dispatch:          # Actions 탭에서 수동 실행

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 블로그·인스타 동기화 후 홈페이지 생성
        run: cd src && python build.py
      - name: 새로 받은 글·사진 저장
        run: |
          git config user.name "gangsan-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data
          git diff --cached --quiet || git commit -m "블로그·인스타 동기화" && git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
